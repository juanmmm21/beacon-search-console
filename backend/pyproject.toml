[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-search-console"
version = "0.2.0"
description = "Buscador funcional completo (FastAPI + React) que ensambla el ecosistema beacon-search-engine sobre un corpus real."
# hatchling >= 1.26 rechaza un readme fuera del directorio del proyecto, y
# este paquete vive en backend/: se usa un README propio del paquete que
# remite al del repositorio.
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    # Las tres dependencias de paquete real de este proyecto, cada una instalada
    # directamente desde su propio repositorio (no publicadas en PyPI): la única
    # pieza del ecosistema que ensambla a las demás, así que es la única que
    # necesita importarlas de verdad en vez de solo leer sus formatos en disco
    # (ver ../PROGRESS.md, nota de handoff de distributed-index-sharding).
    "distributed-index-sharding @ git+https://github.com/juanmmm21/distributed-index-sharding.git@v0.2.0",
    "query-parser-autocomplete @ git+https://github.com/juanmmm21/query-parser-autocomplete.git@v0.1.0",
    "learning-to-rank-reranker @ git+https://github.com/juanmmm21/learning-to-rank-reranker.git@v0.1.0",
    # La evaluación (`evaluation/`) indexa y puntúa con estos dos directamente.
    "inverted-index-builder @ git+https://github.com/juanmmm21/inverted-index-builder.git@v0.2.0",
    "bm25-ranking-engine @ git+https://github.com/juanmmm21/bm25-ranking-engine.git@v0.2.0",
    # Servidor MCP del buscador de documentación (`mcp_server.py`).
    "mcp>=2.3,<3",
]

[project.scripts]
beacon-search-console = "beacon_search_console.__main__:main"

[project.optional-dependencies]
# Búsqueda híbrida (`hybrid.py`): los tres componentes de AI Core, que traen
# PyTorch y transformers. Opcional para que la API y el job de CI de BM25 no
# necesiten instalar varios GB que no usan.
hybrid = [
    "nano-vector-db @ git+https://github.com/juanmmm21/nano-vector-db.git@v0.1.0",
    "cross-encoder-reranker @ git+https://github.com/juanmmm21/cross-encoder-reranker.git@v0.1.0",
    "contrastive-embedding-trainer @ git+https://github.com/juanmmm21/contrastive-embedding-trainer.git@v0.1.0",
]
dev = [
    "pytest>=8,<9",
    # >=1.4: versiones anteriores (0.23-0.26) emiten un DeprecationWarning de
    # `asyncio.get_event_loop_policy` bajo Python 3.14 en cada test async;
    # 1.4.0 ya no la usa internamente. Confirmado corriendo la suite con
    # `-W error::DeprecationWarning` tras la actualización.
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_search_console"]

[tool.hatch.metadata]
# Ninguna de las tres dependencias de arriba está publicada en PyPI; hatchling
# rechaza por defecto una dependencia por URL directa (PEP 508) salvo que se
# habilite explícitamente aquí (mismo patrón ya usado en distributed-index-sharding
# para depender de bm25-ranking-engine).
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)` en valores por defecto es el idioma estándar de
# FastAPI para inyección de dependencias, no la trampa de "objeto mutable
# compartido entre llamadas" que B008 existe para detectar.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
# Los stubs de NumPy 2.x usan sintaxis PEP 695, que mypy solo parsea con
# python_version >= 3.12; no cambia el soporte de Python 3.11 en ejecución
# (`requires-python`). Mismo ajuste que distributed-index-sharding,
# learning-to-rank-reranker y pagerank-link-analysis.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Ninguno de los tres publica un marcador `py.typed` en su distribución
# (verificado directamente en sus árboles fuente, no asumido) — mismo patrón ya
# documentado para `bm25-ranking-engine` en distributed-index-sharding y para
# `lightgbm` en learning-to-rank-reranker.
module = [
    "distributed_index_sharding.*",
    "query_parser_autocomplete.*",
    "learning_to_rank_reranker.*",
    "bm25_ranking_engine.*",
    "inverted_index_builder.*",
    # Componentes de AI Core: tampoco publican `py.typed`.
    "nano_vector_db.*",
    "cross_encoder_reranker.*",
    "contrastive_embedding_trainer.*",
    "transformers.*",
]
ignore_missing_imports = true
